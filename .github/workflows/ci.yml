name: CI

# Runs the tests and the quality checks. It builds no app: APKs and the iOS app are built locally, and release builds
# will get their own workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android + JVM (tests, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the Android versionCode is the number of commits (docs/adr/0007-app-updates-and-data-compatibility.md).
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests, Detekt, ktlint and Android lint
        run: ./gradlew check --continue

      - name: Verify the exported database schemas are committed and unchanged
        # A changed schema file for an existing version means the database version was not bumped (no migration).
        run: |
          if [ -n "$(git status --porcelain -- core/database/schemas)" ]; then
            git status --porcelain -- core/database/schemas
            echo "::error::Room schemas changed. Bump KnoblyDatabase.version, add a migration and commit the new schema (docs/adr/0007-app-updates-and-data-compatibility.md)."
            exit 1
          fi

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-android
          path: |
            **/build/reports/
            **/build/test-results/

  ios:
    name: iOS (shared tests)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Shared tests on the iOS simulator
        run: ./gradlew iosSimulatorArm64Test --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-ios
          path: |
            **/build/reports/
            **/build/test-results/
