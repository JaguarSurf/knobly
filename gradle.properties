# Gradle
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
# On Linux, iOS sources are compiled (klibs) but frameworks cannot be linked; skip those tasks without warnings
# (linking and iOS tests run in CI on macOS).
kotlin.native.ignoreDisabledTargets=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Compose Hot Reload needs the JetBrains Runtime (JBR); download it automatically on first `hotRun`.
compose.reload.jbr.autoProvisioningEnabled=true
